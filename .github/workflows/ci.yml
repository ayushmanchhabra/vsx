name: ci
on:
  pull_request:
    branches:
    - main

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Volta
        uses: volta-cli/action@v5.0.0
      - name: Install dependencies
        run: npm ci
      - name: Lint codebase
        run: npm run lint
      - name: Test codebase
        run: npm run test
      - name: Report coverage
        if: always()
        uses:  davelosert/vitest-coverage-report-action@v2.12.1
